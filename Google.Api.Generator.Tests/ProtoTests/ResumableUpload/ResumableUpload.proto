syntax = "proto3";

import "google/api/annotations.proto";
import "google/api/client.proto";

package google.ads.googleads.v23.services;

option csharp_namespace = "Google.Ads.GoogleAds.V23.Services";

// Service for uploading YouTube videos with resumable upload support.
service YouTubeVideoUploadService {
  option (google.api.default_host) = "googleads.googleapis.com";

  // Creates a YouTube video upload session.
  rpc CreateYouTubeVideoUpload(CreateYouTubeVideoUploadRequest) returns (CreateYouTubeVideoUploadResponse) {
    option (google.api.http) = {
      post: "/v23/customers/{customer_id=*}/youTubeVideoUploads:create"
      body: "*"
    };
  }
}

message CreateYouTubeVideoUploadRequest {
  string customer_id = 1;
}

message CreateYouTubeVideoUploadResponse {
  string resource_name = 1;
}
